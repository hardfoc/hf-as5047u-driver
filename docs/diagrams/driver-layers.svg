<text x="48" y="307.4" font-size="17" font-weight="700" fill="#3730A3">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#3730A3">AS5047U&lt;SpiType&gt;, inc/as5047u.hpp: angle, velocity, diagnostics, outputs, OTP</text>
<text x="56" y="476.4" font-size="20" font-weight="700" fill="#3730A3">SPI interface</text>
<text x="56" y="507" font-size="17" fill="#2B3442">SpiInterface&lt;Derived&gt;: CRTP base, no virtual calls. The driver builds 16-, 24- or 32-bit frames,</text>
<text x="56" y="531.7" font-size="17" fill="#2B3442">the CRC-8, the one-frame-late reads and the read-back check of every write</text>
<text x="56" y="630.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="659.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">bool transfer(tx, rx, len)</text>
<text x="56" y="758.4" font-size="20" font-weight="700" fill="#17202C">AS5047U</text>
<text x="56" y="789" font-size="17" fill="#2B3442">SPI mode 1 up to 10 MHz  /  CSn, CLK, MOSI, MISO</text>
<rect x="32" y="824.8" width="14" height="14" rx="4" fill="#EEF0FF" stroke="#4F46E5" stroke-width="1.4"/>
<text x="54" y="839.4" font-size="16" fill="#566070">this library</text>
<rect x="161.8" y="824.8" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0F8B80" stroke-width="1.4"/>
<text x="183.8" y="839.4" font-size="16" fill="#566070">you write</text>
